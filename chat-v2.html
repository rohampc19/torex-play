<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پیام‌ها | TOREX PLAY</title>
<link rel="stylesheet" href="/core.css"><link rel="stylesheet" href="/chat-v2.css"><link rel="stylesheet" href="/chat-v2-upgrade.css">
</head>
<body>
<main class="messenger-page" aria-label="پیام‌ها">
<aside class="messenger-sidebar"><div class="messenger-sidebar-top"><div class="search-title"><span>گفتگوها</span><span class="message-count" id="messageCount">۰</span></div><label class="user-search"><span aria-hidden="true">⌕</span><input id="userSearch" type="search" placeholder="جستجو در دوستان..." autocomplete="off"></label><button class="add-friend-button" id="addFriendButton" type="button">+ افزودن دوست</button><button class="search-result" id="searchResult" type="button" hidden><span class="search-result-avatar">؟</span><span class="search-result-info"><strong></strong><small>باز کردن گفتگو</small></span></button></div><div class="chat-list" id="chatList" aria-live="polite"><div class="chat-empty">در حال بارگذاری گفتگوها...</div></div></aside>
<section class="conversation"><header class="conversation-header"><button class="mobile-back" id="mobileBack" type="button" aria-label="بازگشت به فهرست">‹</button><button class="conversation-user" id="conversationUser" type="button" aria-label="مشاهده پروفایل عمومی"><span class="conversation-avatar" id="conversationAvatar">؟</span><span class="conversation-meta"><strong id="conversationName">یک گفتگو را انتخاب کنید</strong><small id="conversationHandle">آماده گفتگو</small></span></button><div class="conversation-actions"><button id="profileButton" type="button" aria-label="مشاهده پروفایل عمومی">پروفایل</button></div></header><div class="conversation-messages" id="messages"><div class="empty-conversation"><span class="empty-conversation__hand" aria-hidden="true"><span class="empty-conversation__question">؟</span></span><strong>یک گفتگو را انتخاب کن</strong><p>از فهرست یک دوست انتخاب کن و گفتگو را شروع کن.</p></div></div><form class="message-input-area" id="messageForm"><button class="input-action" id="stickerButton" type="button" aria-label="استیکر و شکلک">☺</button><input id="messageInput" maxlength="500" autocomplete="off" placeholder="پیام خود را بنویسید..." disabled><button class="send-button" type="submit">ارسال</button></form></section></main>
<dialog class="add-friend-modal" id="addFriendModal"><form method="dialog" id="addFriendForm" class="add-friend-form"><h2>افزودن دوست</h2><p class="muted">آیدی بازیکن را وارد کن تا به فهرست دوستانت اضافه شود.</p><label class="add-friend-field"><span>آیدی بازیکن</span><input id="playerIdInput" maxlength="24" autocomplete="off" placeholder="مثال: roham"></label><p id="addFriendMessage" class="add-friend-message" aria-live="polite"></p><div class="add-friend-actions"><button type="submit" class="main-button" id="addFriendSubmit">افزودن</button><button type="button" class="second-button" id="addFriendCancel">لغو</button></div></form></dialog>
<script src="/app.js"></script><script src="/demo-data.js"></script><script src="/chat-v2.js"></script><script src="/chat-v2-upgrade.js"></script><script src="/navigation.js"></script>
</body></html>
