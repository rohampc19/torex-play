<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#05070d">
  <title>ثبت‌نام | TOREX PLAY</title>
  <link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./design-system.css"><link rel="stylesheet" href="./register.css">
</head>
<body class="auth-page auth-register-page">
  <div class="register-background" aria-hidden="true"><div class="register-glow glow-one"></div><div class="register-glow glow-two"></div><div class="register-glow glow-three"></div></div>
  <header class="register-header"><a href="welcome.html" class="register-logo" aria-label="TOREX PLAY">TOREX <span>PLAY</span></a><a href="welcome.html" class="back-button">بازگشت</a></header>
  <main class="register-main"><section class="register-card" aria-labelledby="registerTitle">
    <div class="register-brand"><div class="brand-icon" aria-hidden="true">TP</div><h1 id="registerTitle">ساخت حساب</h1><p>به جامعه گیمرهای <strong>TOREX PLAY</strong> بپیوند!</p></div>
    <form class="register-form" id="registerForm" novalidate>
      <div class="input-group"><label for="username">نام کاربری</label><input type="text" id="username" name="username" placeholder="مثلاً Roham" maxlength="20" autocomplete="username" required><small>نام کاربری باید حداقل ۳ کاراکتر باشد.</small></div>
      <div class="input-group"><label for="phone">شماره موبایل</label><input type="tel" id="phone" name="phone" placeholder="09123456789" inputmode="numeric" autocomplete="tel" maxlength="11" required><small>شماره باید با 09 شروع شود.</small></div>
      <div class="input-group"><label for="password">رمز عبور</label><input type="password" id="password" name="password" placeholder="حداقل ۸ کاراکتر" minlength="8" autocomplete="new-password" required></div>
      <div class="input-group"><label for="confirmPassword">تکرار رمز عبور</label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="رمز عبور را دوباره وارد کنید" minlength="8" autocomplete="new-password" required></div>
      <label class="terms"><input type="checkbox" id="terms" name="terms" required><span>قوانین و شرایط TOREX PLAY را می‌پذیرم.</span></label>
      <div id="registerError" class="register-error" role="alert" aria-live="polite"></div>
      <button type="submit" class="register-submit" id="registerSubmit"><span>ساخت حساب</span><b aria-hidden="true">←</b></button>
      <div class="login-text">قبلاً حساب ساختی؟ <a href="login.html">وارد شو</a></div>
    </form>
  </section></main>
  <footer class="register-footer"><div>TOREX PLAY</div><p>ساخته شده برای گیمرها، توسط گیمرها 🎮</p></footer>
  <script src="./app.js"></script>
  <script>
    const registerForm=document.getElementById("registerForm"),usernameInput=document.getElementById("username"),phoneInput=document.getElementById("phone"),passwordInput=document.getElementById("password"),confirmPasswordInput=document.getElementById("confirmPassword"),termsInput=document.getElementById("terms"),registerError=document.getElementById("registerError"),registerSubmit=document.getElementById("registerSubmit");
    function showError(message,success=false){registerError.textContent=message;registerError.classList.add("show");registerError.classList.toggle("success",success)}
    function hideError(){registerError.textContent="";registerError.classList.remove("show","success")}
    registerForm.addEventListener("submit",async event=>{event.preventDefault();hideError();const username=usernameInput.value.trim(),phone=phoneInput.value.trim(),password=passwordInput.value,confirmPassword=confirmPasswordInput.value;if(username.length<3){showError("نام کاربری باید حداقل ۳ کاراکتر باشد.");usernameInput.focus();return}if(!/^09[0-9]{9}$/.test(phone)){showError("شماره موبایل معتبر نیست. مثال: 09123456789");phoneInput.focus();return}if(password.length<8){showError("رمز عبور باید حداقل ۸ کاراکتر باشد.");passwordInput.focus();return}if(password!==confirmPassword){showError("رمز عبور و تکرار آن یکسان نیست.");confirmPasswordInput.focus();return}if(!termsInput.checked){showError("برای ساخت حساب باید قوانین سایت را بپذیری.");termsInput.focus();return}registerSubmit.disabled=true;registerSubmit.setAttribute("aria-busy","true");try{await window.PERFASHINALRequest("/register",{method:"POST",body:JSON.stringify({username,phone,password})});showError("حساب شما با موفقیت ثبت شد و در انتظار تأیید مدیریت است.",true);setTimeout(()=>{window.location.href="login.html"},1600)}catch(error){showError(error.message||"ثبت‌نام انجام نشد. دوباره تلاش کن.");registerSubmit.disabled=false;registerSubmit.removeAttribute("aria-busy")}});
    phoneInput.addEventListener("input",()=>{phoneInput.value=phoneInput.value.replace(/[^0-9]/g,"");hideError()});[usernameInput,passwordInput,confirmPasswordInput].forEach(input=>input.addEventListener("input",hideError));termsInput.addEventListener("change",hideError);
  </script>
</body></html>
