<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>گروه‌ها | VEXORA CHAT</title>
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="groups.css">
</head>

<body class="groups-page">
    <main class="groups-shell">
        <header class="groups-heading">
            <div><span class="groups-kicker">VEXORA COMMUNITY</span>
                <h1>گروه‌ها</h1>
                <p>گروه مناسب خودت را پیدا کن یا یک جمع تازه بساز.</p>
            </div><button class="main-button" id="createGroupButton" type="button">ساخت گروه</button>
        </header>
        <p class="groups-message" id="groupsMessage" aria-live="polite"></p>
        <section class="groups-grid" id="groupsGrid">
            <p class="empty-state">در حال دریافت گروه‌ها...</p>
        </section>
    </main>
    <dialog id="createGroupDialog" class="group-dialog">
        <form id="createGroupForm" method="dialog">
            <h2>ساخت گروه</h2><label>نام گروه<input id="groupName" maxlength="80" required></label><label>توضیحات
                گروه<textarea id="groupDescription" maxlength="500" rows="4"></textarea></label><label>تصویر گروه<input
                    id="groupAvatar" type="file" accept="image/*"></label><label>نوع گروه<select id="groupType">
                    <option value="public">عمومی</option>
                    <option value="private">خصوصی</option>
                </select></label>
            <p class="form-error" id="groupFormError"></p>
            <div class="dialog-actions"><button class="main-button" type="submit">ایجاد گروه</button><button
                    class="second-button" id="cancelGroupButton" type="button">لغو</button></div>
        </form>
    </dialog>
    <script src="app.js"></script>
    <script src="groups.js"></script>
    <script src="navigation.js"></script>
</body>

</html>
