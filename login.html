
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود | PERFASHINAL</title>

    <!-- =========================
         FONT
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- =========================
         LOGIN CSS
    ========================== -->

<link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./design-system.css">

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="login-background">

        <div class="login-glow glow-one"></div>

        <div class="login-glow glow-two"></div>

        <div class="login-glow glow-three"></div>

    </div>



    <!-- =========================
         HEADER
    ========================== -->

    <header class="login-header">

        <a
            href="welcome.html"
            class="login-logo"
        >
            PERFASHINAL
            <span>PLAY</span>
        </a>


        <a
            href="welcom.html"
            class="back-button"
        >
            بازگشت
        </a>

    </header>



    <!-- =========================
         LOGIN MAIN
    ========================== -->

    <main class="login-main">


        <section class="login-card">


            <!-- =====================
                 BRAND
            ====================== -->

            <div class="login-brand">

                <div class="brand-icon">
                    ورود
                </div>


                <h1>
                    خوش برگشتی!
                </h1>


                <p>
                    برای ورود به دنیای
                    <strong>PERFASHINAL</strong>
                    وارد حساب خودت شو.
                </p>

            </div>



            <!-- =====================
                 FORM
            ====================== -->

            <form
                class="login-form"
                id="loginForm"
                novalidate
            >


                <!-- =================
                     PHONE
                ================== -->

                <div class="input-group">

                    <label for="phone">
                        شماره موبایل
                    </label>


                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09123456789"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="11"
                        required
                    >


                    <small>
                        شماره باید با 09 شروع شود.
                    </small>

                </div>



                <!-- =================
                     PASSWORD
                ================== -->

                <div class="input-group">


                    <div class="password-label">

                        <label for="password">
                            رمز عبور
                        </label>


                        <a href="#" id="forgotPasswordLink">
                            فراموشی رمز؟
                        </a>

                    </div>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="رمز عبور خود را وارد کنید"
                        autocomplete="current-password"
                        minlength="8"
                        required
                    >

                </div>



                <!-- =================
                     REMEMBER
                ================== -->

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        مرا به خاطر بسپار
                    </span>

                </label>



                <!-- =================
                     ERROR
                ================== -->

                <div
                    id="loginError"
                    class="login-error"
                    role="alert"
                ></div>



                <!-- =================
                     LOGIN BUTTON
                ================== -->

                <button
                    type="submit"
                    class="login-submit"
                >

                    <span>
                        ورود به PERFASHINAL
                    </span>

                    <b>
                        ←
                    </b>

                </button>



                <!-- =================
                     DIVIDER
                ================== -->

                <div class="divider">

                    <span></span>

                    <p>
                        یا
                    </p>

                    <span></span>

                </div>



                <!-- =================
                     REGISTER
                ================== -->

                <div class="register-text">

                    حساب کاربری نداری؟

                    <a href="register.html">
                        ثبت‌نام کن
                    </a>

                </div>


            </form>


        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="login-footer">

        <div class="footer-brand">
            PERFASHINAL
        </div>


        <p>
            دنیای گیم، جامعه گیمرها و تجربه‌ای متفاوت 🎮
        </p>

    </footer>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="./app.js"></script>
    <script>

        // ============================
        // ELEMENTS
        // ============================

        const loginForm =
            document.getElementById("loginForm");

        const phoneInput =
            document.getElementById("phone");

        const passwordInput =
            document.getElementById("password");

        const loginError =
            document.getElementById("loginError");



        // ============================
        // SHOW ERROR
        // ============================

        function showError(message) {

            loginError.textContent = message;

            loginError.classList.add("show");

        }



        // ============================
        // HIDE ERROR
        // ============================

        function hideError() {

            loginError.textContent = "";

            loginError.classList.remove("show");

        }



        // ============================
        // PHONE VALIDATION
        // ============================

        function isValidIranianPhone(phone) {

            /*
                شماره معتبر ایران:

                09123456789

                11 رقم
                شروع با 09
            */

            const phoneRegex =
                /^09[0-9]{9}$/;

            return phoneRegex.test(phone);

        }



        // ============================
        // FORM SUBMIT
        // ============================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                hideError();



                // ======================
                // GET VALUES
                // ======================

                const phone =
                    phoneInput.value.trim();

                const password =
                    passwordInput.value;



                // ======================
                // PHONE EMPTY
                // ======================

                if (phone === "") {

                    showError(
                        "لطفاً شماره موبایل خود را وارد کنید."
                    );

                    phoneInput.focus();

                    return;

                }



                // ======================
                // PHONE VALIDATION
                // ======================

                if (!isValidIranianPhone(phone)) {

                    showError(
                        "شماره موبایل معتبر نیست. مثال: 09123456789"
                    );

                    phoneInput.focus();

                    return;

                }



                // ======================
                // PASSWORD EMPTY
                // ======================

                if (password === "") {

                    showError(
                        "لطفاً رمز عبور خود را وارد کنید."
                    );

                    passwordInput.focus();

                    return;

                }



                // ======================
                // PASSWORD LENGTH
                // ======================

                if (password.length < 8) {

                    showError(
                        "رمز عبور باید حداقل ۸ کاراکتر باشد."
                    );

                    passwordInput.focus();

                    return;

                }



                // Authenticate through the local API; demo mode can replace this provider later.
                const submit = loginForm.querySelector("button[type=submit]");
                submit.disabled = true;
                try {
                    const result = await window.PERFASHINALRequest("/login", { method: "POST", body: JSON.stringify({ phone, password }) });
                    localStorage.setItem("PERFASHINALUser", JSON.stringify(result.user));
                    localStorage.setItem("PERFASHINALToken", result.token);
                    localStorage.setItem("PERFASHINALLoggedIn", "true");
                } catch (error) {
                    showError(error.message);
                    submit.disabled = false;
                    return;
                }

                // ======================
                // SUCCESS
                // ======================

                loginError.classList.remove("show");



                /*
                    ورود موفق
                */

                window.location.href =
                    "index.html";

            }
        );



        // ============================
        // REMOVE NON-NUMERIC CHARACTERS
        // ============================

        document.getElementById("forgotPasswordLink")?.addEventListener("click", function(event) {
            event.preventDefault();
            alert("برای بازیابی رمز عبور، لطفاً به آیدی روبیکا پشتیبانی پیام دهید. آیدی پشتیبانی بعداً اعلام می‌شود.");
        });

        phoneInput.addEventListener(
            "input",
            function() {

                this.value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );

            }
        );



        // ============================
        // HIDE ERROR WHEN USER TYPES
        // ============================

        phoneInput.addEventListener(
            "input",
            hideError
        );


        passwordInput.addEventListener(
            "input",
            hideError
        );

    </script>


</body>

</html>
