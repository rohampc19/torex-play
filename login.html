<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070d">
  <title>ورود | TOREX PLAY</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./design-system.css">
  <link rel="stylesheet" href="./login.css">
</head>
<body class="auth-page auth-login-page">
  <div class="login-background" aria-hidden="true"><div class="login-glow glow-one"></div><div class="login-glow glow-two"></div><div class="login-glow glow-three"></div></div>
  <header class="login-header"><a href="welcome.html" class="login-logo" aria-label="TOREX PLAY">TOREX <span>PLAY</span></a><a href="welcome.html" class="back-button">بازگشت</a></header>
  <main class="login-main">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand"><div class="brand-icon" aria-hidden="true">TP</div><h1 id="loginTitle">خوش برگشتی!</h1><p>برای ورود به دنیای <strong>TOREX PLAY</strong> وارد حساب خودت شو.</p></div>
      <form class="login-form" id="loginForm" novalidate>
        <div class="input-group"><label for="phone">شماره موبایل</label><input type="tel" id="phone" name="phone" placeholder="09123456789" inputmode="numeric" autocomplete="tel" maxlength="11" required><small>شماره باید با 09 شروع شود.</small></div>
        <div class="input-group"><div class="password-label"><label for="password">رمز عبور</label><a href="#" id="forgotPasswordLink">فراموشی رمز؟</a></div><input type="password" id="password" name="password" placeholder="رمز عبور خود را وارد کنید" autocomplete="current-password" minlength="8" required></div>
        <label class="remember"><input type="checkbox" id="remember" name="remember"><span>مرا به خاطر بسپار</span></label>
        <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>
        <button type="submit" class="login-submit" id="loginSubmit"><span>ورود به TOREX PLAY</span><b aria-hidden="true">←</b></button>
        <div class="divider" aria-hidden="true"><span></span><p>یا</p><span></span></div>
        <div class="register-text">حساب کاربری نداری؟ <a href="register.html">ثبت‌نام کن</a></div>
      </form>
    </section>
  </main>
  <footer class="login-footer"><div class="footer-brand">TOREX PLAY</div><p>دنیای گیم، جامعه گیمرها و تجربه‌ای متفاوت 🎮</p></footer>
  <script src="./app.js"></script>
  <script>
    const loginForm=document.getElementById("loginForm"),phoneInput=document.getElementById("phone"),passwordInput=document.getElementById("password"),loginError=document.getElementById("loginError"),loginSubmit=document.getElementById("loginSubmit");
    function showError(message){loginError.textContent=message;loginError.classList.add("show");loginError.classList.remove("success");}
    function hideError(){loginError.textContent="";loginError.classList.remove("show","success");}
    loginForm.addEventListener("submit",async event=>{event.preventDefault();hideError();const phone=phoneInput.value.trim(),password=passwordInput.value;if(!/^09[0-9]{9}$/.test(phone)){showError("شماره موبایل معتبر نیست. مثال: 09123456789");phoneInput.focus();return;}if(password.length<8){showError("رمز عبور باید حداقل ۸ کاراکتر باشد.");passwordInput.focus();return;}loginSubmit.disabled=true;loginSubmit.setAttribute("aria-busy","true");try{const result=await window.PERFASHINALRequest("/login",{method:"POST",body:JSON.stringify({phone,password})});const storage=document.getElementById("remember").checked?localStorage:sessionStorage;storage.setItem("PERFASHINALUser",JSON.stringify(result.user));storage.setItem("PERFASHINALToken",result.token);storage.setItem("PERFASHINALLoggedIn","true");window.location.href="index.html";}catch(error){showError(error.message||"ورود انجام نشد. دوباره تلاش کن.");loginSubmit.disabled=false;loginSubmit.removeAttribute("aria-busy");}});
    document.getElementById("forgotPasswordLink")?.addEventListener("click",event=>{event.preventDefault();showError("بازیابی رمز عبور هنوز فعال نشده است.");});
    phoneInput.addEventListener("input",()=>{phoneInput.value=phoneInput.value.replace(/[^0-9]/g,"");hideError();});passwordInput.addEventListener("input",hideError);
  </script>
</body>
</html>
