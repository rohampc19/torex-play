name: apply-vexora-chat-migration
on:
  push:
    paths:
      - '.vexora-bundle/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract migration bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .vexora-bundle/part-00 || exit 0
          mkdir -p /tmp/vexora-chat
          cat .vexora-bundle/part-* > /tmp/vexora-chat/project.b64
          base64 -d /tmp/vexora-chat/project.b64 > /tmp/vexora-chat/project.tar.gz
          tar -xzf /tmp/vexora-chat/project.tar.gz -C /tmp/vexora-chat
          cp -a /tmp/vexora-chat/torex-chat-migration/. . 2>/dev/null || cp -a /tmp/vexora-chat/. .
          rm -rf .vexora-bundle /tmp/vexora-chat
      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: apply VEXORA CHAT full-stack migration'
          git push